name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Types, lint, unit + integration tests, build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # verify includes the webview tests, which drive the runner's preinstalled Google Chrome.
      - name: Verify
        run: npm run verify

      # Real VS Code extension host (downloaded by @vscode/test-electron); xvfb provides a display.
      - name: Integration tests
        run: xvfb-run -a npm run test:integration
